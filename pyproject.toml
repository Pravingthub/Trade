[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731", "E702", "E701", "B905", "E741"]  # h, l, c is standard OHLC notation

[tool.ruff.lint.per-file-ignores]
"test_indicator_parity.py" = ["E402"]  # import after importorskip
